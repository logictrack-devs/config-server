server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/logictrack-devs/config-ms.git
          default-label: developer
          clone-on-start: true
          force-pull: true          # siempre trae el último commit de la rama
          timeout: 10               # segundos de espera al clonar/fetchear
          delete-untracked-branches: true