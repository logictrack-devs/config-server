services:
  # 1. BASE DE DATOS UNIFICADA
  mysql-db:
    image: mysql:8.4
    container_name: mysql-logitrack
    env_file: ./.env # Carga MYSQL_ROOT_PASSWORD desde el .env del config-server
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logitrack-net
    healthcheck:
      # Se usa la variable de entorno para no dejar la contraseña hardcodeada
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2.0'

  # 2. SERVIDOR DE CONFIGURACIÓN
  config-server:
    build:
      context: .
    container_name: logitrack-config-server
    env_file: ./.env
    ports:
      - "8888:8888"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - logitrack-net
    healthcheck:
      # CRÍTICO: Este healthcheck garantiza que Spring Boot ya levantó el puerto 8888
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '1.5'

  # 3. EUREKA SERVER (8065)
  eureka-server:
    build:
      context: ../eureka-server
    container_name: logitrack-eureka
    restart: on-failure
    mem_limit: 512m
    ports:
      - "8065:8065"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - logitrack-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8065/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 3. SEGURIDAD (8080)
  security-service:
    build:
      context: ../security-service
    container_name: logitrack-security
    env_file: ../security-service/.env
    environment:
      EUREKA_URL: "http://eureka-server:8065/eureka/"
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy # CRÍTICO: Cambiado de service_started a service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net
    deploy:
      resources:
        limits:
          cpus: '2.0'

  # 4. ENVÍOS (8081)
  shipment-service:
    build:
      context: ../shipment-service
    container_name: logitrack-shipment
    env_file: ../shipment-service/.env
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy # CRÍTICO: Cambiado a service_healthy
    networks:
      - logitrack-net
    deploy:
      resources:
        limits:
          cpus: '2.0'

  # 5. REPARTIDORES (8082)
  courier-service:
    build:
      context: ../courier-service
    container_name: logitrack-courier
    env_file: ../courier-service/.env
    environment:
      EUREKA_URL: "http://eureka-server:8065/eureka/"
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
      config-server:
        condition: service_healthy # CRÍTICO: Cambiado a service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - logitrack-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
  # 6. API GATEWAY (8066)
  api-gateway:
    build:
      context: ../api-gateway
    container_name: logitrack-gateway
    restart: on-failure
    mem_limit: 512m
    ports:
      - "8066:8066"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_URL: "http://eureka-server:8065/eureka/"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      security-service:
        condition: service_started
      courier-service:
        condition: service_started
      shipment-service:
        condition: service_started
    networks:
      - logitrack-net


volumes:
  mysql_data:

networks:
  logitrack-net:
    driver: bridge